<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A guest's own appointment, reached from the link in their emails. The
       reference and token in the address are the credential, so nothing here
       is for search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png">
  <title>Your appointment | Synergy Salon</title>
  <style>
    :root {
      --ink: #17181c; --muted: #5e6068; --faint: #9a9ca3; --line: #e6e6e9;
      --bg: #faf9f7; --card: #ffffff; --accent: #17181c; --accent-ink: #ffffff;
      --soft: #f2f1ee; --ok: #2f7d4f; --warn: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #ededf0; --muted: #a8a9b0; --faint: #74757d; --line: #2c2d33;
        --bg: #111214; --card: #18191d; --accent: #ededf0; --accent-ink: #111214;
        --soft: #222328; --ok: #6cc28f; --warn: #ef8a83;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
    .brand { display: block; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 14px;
             color: var(--ink); text-decoration: none; margin-bottom: 28px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .row span { color: var(--muted); }
    .row b { font-weight: 600; text-align: right; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
              background: var(--soft); color: var(--muted); margin-bottom: 12px; }
    .status.ok { color: var(--ok); }
    .status.off { color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button { font: inherit; cursor: pointer; }
    .btn { height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.danger { background: transparent; color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .btn:disabled { opacity: .5; cursor: default; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .day { flex: none; min-width: 64px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); text-align: center; line-height: 1.25; }
    .day small { display: block; font-size: 12px; color: var(--muted); }
    .day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .time { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .time[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .muted { color: var(--muted); }
    .note { padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; margin-bottom: 16px; }
    .note.bad { color: var(--warn); }
    #move { margin-top: 16px; }
    .hidden { display: none !important; }
    a { color: inherit; }
  </style>
</head>
<body>
<main>
  <a class="brand" href="/">Synergy Salon</a>
  <h1 id="title">Your appointment</h1>
  <p class="lede" id="lede">One moment while we find it.</p>
  <div id="msg" class="note hidden" role="status"></div>

  <section id="view" class="hidden">
    <div class="card">
      <span class="status" id="status"></span>
      <div class="row"><span>When</span><b id="when"></b></div>
      <div class="row"><span>Service</span><b id="service"></b></div>
      <div class="row"><span>With</span><b id="stylist"></b></div>
    </div>
    <div class="actions" id="actions">
      <button type="button" class="btn" id="moveBtn">Choose a new time</button>
      <button type="button" class="btn danger" id="cancelBtn">Cancel appointment</button>
    </div>
  </section>

  <section id="move" class="card hidden" aria-labelledby="moveTitle">
    <h2 id="moveTitle">Pick a new time</h2>
    <p class="muted" id="moveSub" style="margin:-6px 0 12px">Same stylist, same services. Times shown are open right now.</p>
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <div class="times" id="times" role="group" aria-label="Time"></div>
    <div class="actions">
      <button type="button" class="btn" id="confirmMove" disabled>Move my appointment</button>
      <button type="button" class="btn quiet" id="closeMove">Keep it as it is</button>
    </div>
  </section>

  <p class="muted" style="margin-top:28px;font-size:15px">Questions? Call or text the salon at
    <a href="tel:+18136542055">813.654.2055</a>.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ref = q.get('ref') || '', token = q.get('t') || '';
  var base = '/api/appointment?ref=' + encodeURIComponent(ref) + '&t=' + encodeURIComponent(token);
  var appt = null, zone = 'America/New_York', days = [], pick = { day: '', start: '' };
  var $ = function (id) { return document.getElementById(id); };

  function say(text, bad) {
    $('msg').textContent = text;
    $('msg').className = 'note' + (bad ? ' bad' : '');
  }
  function quiet() { $('msg').className = 'note hidden'; }

  // Always on the salon's clock: a guest abroad still means the salon's 2pm.
  function fmt(iso, opts) {
    return new Date(iso).toLocaleString('en-US', Object.assign({ timeZone: zone }, opts));
  }
  function whenText(iso) {
    return fmt(iso, { weekday: 'long', month: 'long', day: 'numeric' }) + ' at '
      + fmt(iso, { hour: 'numeric', minute: '2-digit' });
  }
  function isoDay(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function call(method, extra, body) {
    return fetch(base + (extra || ''), {
      method: method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || 'Something went wrong. Please call the salon.');
        return d;
      });
    });
  }

  function paint() {
    var past = new Date(appt.startsAt) <= new Date();
    var off = appt.status === 'cancelled';
    $('title').textContent = off ? 'This appointment is cancelled' : 'Your appointment';
    $('lede').textContent = off
      ? 'Nothing more to do. We would love to see you another time.'
      : past ? 'This appointment has already started or passed.'
        : 'Need a different time? You can move or cancel it here.';
    $('status').textContent = off ? 'Cancelled' : past ? 'Past' : 'Booked';
    $('status').className = 'status ' + (off ? 'off' : past ? '' : 'ok');
    $('when').textContent = whenText(appt.startsAt);
    $('service').textContent = appt.service;
    $('stylist').textContent = appt.stylist;
    $('actions').classList.toggle('hidden', off || past);
    $('view').classList.remove('hidden');
  }

  function load() {
    if (!ref || !token) { $('lede').textContent = ''; say('This link is not complete. Please use the link in your email.', true); return; }
    call('GET').then(function (d) { appt = d; paint(); })
      .catch(function (e) { $('lede').textContent = ''; say(e.message, true); });
  }

  // The next four weeks of open times, asked for once when the picker opens.
  function openMove() {
    quiet();
    $('move').classList.remove('hidden');
    $('days').innerHTML = '<span class="muted">Finding open times…</span>';
    $('times').innerHTML = '';
    var from = new Date(), to = new Date();
    to.setDate(to.getDate() + 28);
    call('GET', '&from=' + isoDay(from) + '&to=' + isoDay(to)).then(function (d) {
      zone = d.timezone || zone;
      days = (d.days || []).filter(function (x) { return x.slots.length; });
      if (!days.length) {
        $('days').innerHTML = '<span class="muted">No open times in the next four weeks. Please call the salon and we will find one.</span>';
        return;
      }
      pick = { day: days[0].date, start: '' };
      paintDays();
    }).catch(function (e) { $('days').innerHTML = ''; say(e.message, true); });
    $('move').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function paintDays() {
    $('days').innerHTML = days.map(function (d) {
      var noon = d.date + 'T12:00:00';
      return '<button type="button" class="day" data-day="' + d.date + '" aria-pressed="' + (d.date === pick.day) + '">'
        + '<small>' + new Date(noon).toLocaleDateString('en-US', { weekday: 'short' }) + '</small>'
        + new Date(noon).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</button>';
    }).join('');
    var day = days.find(function (d) { return d.date === pick.day; }) || { slots: [] };
    $('times').innerHTML = day.slots.map(function (s) {
      return '<button type="button" class="time" data-start="' + s + '" aria-pressed="' + (s === pick.start) + '">'
        + fmt(s, { hour: 'numeric', minute: '2-digit' }) + '</button>';
    }).join('');
    $('confirmMove').disabled = !pick.start;
  }

  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('[data-day]');
    if (!b) return;
    pick = { day: b.getAttribute('data-day'), start: '' };
    paintDays();
  });
  $('times').addEventListener('click', function (e) {
    var b = e.target.closest('[data-start]');
    if (!b) return;
    pick.start = b.getAttribute('data-start');
    paintDays();
  });

  $('moveBtn').onclick = openMove;
  $('closeMove').onclick = function () { $('move').classList.add('hidden'); };

  $('confirmMove').onclick = function () {
    var b = this;
    b.disabled = true;
    b.textContent = 'Moving…';
    call('PATCH', '', { start: pick.start }).then(function (d) {
      appt = d;
      $('move').classList.add('hidden');
      paint();
      say('Done. Your appointment is now ' + whenText(d.startsAt) + '.');
    }).catch(function (e) {
      // Somebody may have taken it while they were choosing: show fresh times.
      say(e.message, true);
      openMove();
    }).then(function () { b.textContent = 'Move my appointment'; });
  };

  $('cancelBtn').onclick = function () {
    if (!confirm('Cancel your appointment on ' + whenText(appt.startsAt) + '?')) return;
    var b = this;
    b.disabled = true;
    call('DELETE').then(function (d) {
      appt = d;
      $('move').classList.add('hidden');
      paint();
      say('Your appointment is cancelled. We have let the salon know.');
    }).catch(function (e) { say(e.message, true); b.disabled = false; });
  };

  load();
})();
</script>
</body>
</html>
