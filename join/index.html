Fsvg>Your calendar on Synergy's booking platform<\u002Fli>\n<li><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>Your profile on synergysalon.com<\u002Fli>\n<li><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>Back bar, color, towels, and utilities<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<p class=\"pcard-note\">Your exact rate depends on your chair and schedule. We'll walk you through it on your tour. Only 2 booths are open right now.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec wrap\" id=\"faq\" data-screen-label=\"FAQ\">\n<div class=\"head center\">\n<p class=\"label\">Honest answers<\u002Fp>\n<h2 class=\"h2\">Questions <span class=\"hl\">stylists ask us.<\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<div class=\"faq\">\n<details><summary>Isn't booth rent risky? I'd be on my own.<\u002Fsummary><p>You own your business, inside a well-marketed salon with real front-door traffic and a master-level team around you. Autonomy without isolation.<\u002Fp><\u002Fdetails>\n<details><summary>Can I bring my own clients?<\u002Fsummary><p>Yes, that's the whole idea. Your regulars book with you on our platform, and your book stays your business.<\u002Fp><\u002Fdetails>\n<details><summary>I'm great behind the chair, not at marketing.<\u002Fsummary><p>You don't have to be. Synergy handles the marketing and the admin side of your chair, so you can focus on your clients.<\u002Fp><\u002Fdetails>\n<details><summary>So what's the catch?<\u002Fsummary><p>No catch, just limited space. We only have 2 booths open, and we'd rather fill them with the right stylists than rush it.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"final-band\" id=\"book\" data-screen-label=\"Final CTA\">\n<div class=\"final\">\n<img class=\"final-bg\" src=\"/assets/94f3b61b-78cd-42a3-9739-50ad3d4e1254.webp\" alt=\"\" aria-hidden=\"true\" loading=\"lazy\" decoding=\"async\">\n<div class=\"final-shade\"><\u002Fdiv>\n<div class=\"final-grid\">\n<div class=\"final-copy\">\n<p class=\"label label-glass\">Only 2 booths available<\u002Fp>\n<h2 class=\"h2\">Let's find <span class=\"hl-light\">your chair.<\u002Fspan><\u002Fh2>\n<p class=\"lede\">Booths go to the right stylists, not the first ones. Book a tour to see the room, meet the team, and talk numbers with Dina.<\u002Fp>\n<div class=\"final-cta\"><a class=\"btn btn-lg\" href=\"#tour\"><span class=\"lbl\">Book a Salon Tour<\u002Fspan><span class=\"arr\" aria-hidden=\"true\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa><a class=\"btn btn-lg btn-ghost\" href=\"tel:8136542055\"><span class=\"lbl\">Call 813.654.2055<\u002Fspan><span class=\"arr\" aria-hidden=\"true\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa><\u002Fdiv>\n<ul class=\"info\">\n<li><span class=\"ic\" aria-hidden=\"true\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><b>Rather talk?<\u002Fb><a href=\"tel:8136542055\">813.654.2055<\u002Fa><\u002Fdiv><\u002Fli>\n<li><span class=\"ic\" aria-hidden=\"true\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><b>Come see us<\u002Fb><a href=\"https://www.google.com/maps/search/?api=1&amp;query=3212+Lithia+Pinecrest+Rd+Suite+101+Valrico+FL+33594\" target=\"_blank\" rel=\"noopener\">3212 Lithia Pinecrest Rd, Suite 101, Valrico, FL 33594<\u002Fa><\u002Fdiv><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"hours\">\n<p class=\"hours-k\">Tours during salon hours<\u002Fp>\n<dl>\n<dt>Mon, Tue, Sat<\u002Fdt><dd>9:00 am to 3:00 pm<\u002Fdd>\n<dt>Wed, Thu<\u002Fdt><dd>9:00 am to 7:00 pm<\u002Fdd>\n<dt>Fri<\u002Fdt><dd>9:00 am to 6:00 pm<\u002Fdd>\n<dt>Sun<\u002Fdt><dd>Closed<\u002Fdd>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<footer class=\"site-foot\" data-screen-label=\"Footer\">\n<div class=\"foot\">\n<div class=\"foot-top\">\n<img class=\"foot-logo\" src=\"/assets/ffab2b97-0312-452d-92b9-f54eefd7b45f.png\" alt=\"Synergy Salon\" loading=\"lazy\" decoding=\"async\">\n<div class=\"foot-social\">\n<a class=\"fso\" href=\"https://www.facebook.com/SynergySalonValrico\" target=\"_blank\" rel=\"noopener\" aria-label=\"Synergy Salon on Facebook\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a class=\"fso\" href=\"https://www.instagram.com/SynergySalonValrico\" target=\"_blank\" rel=\"noopener\" aria-label=\"Synergy Salon on Instagram\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.3-3.3a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"foot-bot\">\n<p>3212 Lithia Pinecrest Rd, Suite 101, Valrico, FL 33594 · <a href=\"tel:8136542055\">813.654.2055<\u002Fa> · <a href=\"mailto:hair@synergysalon.com\">hair@synergysalon.com<\u002Fa><\u002Fp>\n<p>© 2026 Synergy Salon of Tampa Bay, Inc. · <a class=\"flink\" href=\"https://synergysalon.com/privacy-policy\">Privacy policy<\u002Fa> · <a class=\"flink\" href=\"https://synergysalon.com/terms\">Terms &amp; Conditions<\u002Fa> · Hablamos español<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<div class=\"mbar\">\n<a class=\"call\" href=\"tel:8136542055\" aria-label=\"Call 813.654.2055\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a class=\"btn\" href=\"#tour\"><span class=\"lbl\">Book a Salon Tour<\u002Fspan><span class=\"arr\" aria-hidden=\"true\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._onMsg = e => {\n      if (!/leadconnectorhq|msgsndr|gohighlevel/i.test(e.origin || '')) return;\n      let s = e.data; try { s = typeof s === 'string' ? s : JSON.stringify(s); } catch (_) { return; }\n      if (/form[-_ ]?submit|submitted|form-submission|thank/i.test(s)) {\n        const standalone = !/\\.dc\\.html$/i.test(location.pathname);\n        location.href = standalone ? 'Thank You.html' : 'Thank You.dc.html';\n      }\n    };\n    window.addEventListener('message', this._onMsg);\n    this.joinMount();\n  }\n  componentWillUnmount() { window.removeEventListener('message', this._onMsg); this._joinOff && this._joinOff(); }\n  // Everything the main site's header and scroll do, here. Plain DOM rather\n  // than state, because this page renders once and never re-renders: a\n  // setState would redraw the template and drop the transforms set below.\n  async joinMount() {\n    const root = document.querySelector('.rc');\n    if (!root) return;\n    const offs = [];\n    const on = (el, ev, fn, opt) => { el.addEventListener(ev, fn, opt); offs.push(() => el.removeEventListener(ev, fn, opt)); };\n    this._joinOff = () => offs.forEach((f) => f());\n    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;\n\n    // Today's hours on the salon's clock, the same table as the main site.\n    const dow = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(new Date());\n    const hrs = { Mon: '9a to 3p', Tue: '9a to 3p', Wed: '9a to 7p', Thu: '9a to 7p', Fri: '9a to 6p', Sat: '9a to 3p', Sun: 'closed' }[dow];\n    root.querySelectorAll('[data-today-hours]').forEach((el) => {\n      el.textContent = !hrs ? '' : hrs === 'closed' ? 'Closed today' : `Open today ${hrs}`;\n    });\n\n    // Lenis on the GSAP ticker, exactly as synergysalon.com sets it up. The\n    // libraries load deferred, so wait for them as the main site does.\n    const t0 = Date.now();\n    while (!(window.gsap && window.ScrollTrigger && window.Lenis) && Date.now() - t0 < 2500) {\n      await new Promise((r) => setTimeout(r, 20));\n    }\n    let lenis = null;\n    if (!reduced && window.gsap && window.Lenis) {\n      const gsap = window.gsap;\n      if (window.ScrollTrigger) gsap.registerPlugin(window.ScrollTrigger);\n      lenis = this.lenis = new window.Lenis({ autoRaf: false });\n      if (window.ScrollTrigger) lenis.on('scroll', window.ScrollTrigger.update);\n      const tick = (t) => lenis.raf(t * 1000);\n      gsap.ticker.add(tick);\n      gsap.ticker.lagSmoothing(0);\n      offs.push(() => { gsap.ticker.remove(tick); lenis.destroy(); });\n    }\n\n    // The drawer.\n    const drawer = root.querySelector('.drawer');\n    const burger = root.querySelector('.burger');\n    const setDrawer = (open) => {\n      if (!drawer) return;\n      const was = drawer.classList.contains('open');\n      drawer.classList.toggle('open', open);\n      drawer.setAttribute('aria-hidden', String(!open));\n      if (burger) burger.setAttribute('aria-expanded', String(open));\n      document.body.classList.toggle('drawer-open', open);\n      if (lenis) (open ? lenis.stop() : lenis.start());\n      if (open) drawer.querySelector('.drawer-close')?.focus();\n      else if (was && burger && getComputedStyle(burger).display !== 'none') burger.focus();\n    };\n    if (burger) on(burger, 'click', () => setDrawer(true));\n    const closer = drawer?.querySelector('.drawer-close');\n    if (closer) on(closer, 'click', () => setDrawer(false));\n    on(window, 'keydown', (e) => { if (e.key === 'Escape' && drawer?.classList.contains('open')) setDrawer(false); });\n    on(window, 'resize', () => { if (window.innerWidth >= 992 && drawer?.classList.contains('open')) setDrawer(false); });\n\n    // In-page links: smooth, and landing clear of the top edge. The tour\n    // lands with the whole form in view: its heading too when both fit, the\n    // form alone at the top when they do not (phones, short laptops), and\n    // the phone's bottom bar is counted as covering the screen it covers.\n    const goTo = (target) => {\n      const top = (el) => el.getBoundingClientRect().top + window.scrollY;\n      let y = target.id === 'top' ? 0 : top(target) - rem() * 1.5;\n      if (target.id === 'tour') {\n        const tour = target.querySelector('.tour') || target;\n        const box = target.querySelector('.ghl-box');\n        const bar = document.querySelector('.mbar');\n        const covered = bar && getComputedStyle(bar).display !== 'none' ? bar.getBoundingClientRect().height + rem() * 0.75 : 0;\n        const room = window.innerHeight - covered - rem() * 3;\n        const end = box ? box.getBoundingClientRect().bottom + window.scrollY : top(tour) + tour.offsetHeight;\n        y = (!box || end - top(tour) <= room) ? top(tour) - rem() * 1.5 : top(box) - rem() * 1.5;\n      }\n      if (lenis) lenis.scrollTo(Math.max(0, y), { duration: 1.2 });\n      else window.scrollTo({ top: Math.max(0, y), behavior: reduced ? 'auto' : 'smooth' });\n    };\n    // On the document, not the page root: the phone's bottom bar sits outside it.\n    on(document, 'click', (e) => {\n      const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n      if (!a) return;\n      const id = a.getAttribute('href');\n      const target = id.length > 1 && document.querySelector(id);\n      if (!target) return;\n      e.preventDefault();\n      const wasOpen = drawer?.classList.contains('open');\n      if (wasOpen) setDrawer(false);\n      history.replaceState(null, '', id === '#top' ? location.pathname : id);\n      // After the drawer has started to close, so its scroll lock is released.\n      setTimeout(() => goTo(target), wasOpen ? 60 : 0);\n    });\n\n    // The chair, placed as synergysalon.com places it: its visible top a\n    // little above the bottom of the headline's last line, as tall as the\n    // room down to 4% above the card's foot allows, no wider than 45% of the\n    // headline, and centred on the card by the chair itself rather than the\n    // image's transparent canvas. Phones place it in CSS (join-fold.css).\n    const card = root.querySelector('.hero-card.jf');\n    const chair = card?.querySelector('.jf-front');\n    const vis = { top: 0.4602, bottom: 0.9880, left: 0.3922, right: 0.6167 }; // measured from the image's alpha\n    const placeChair = () => {\n      if (!card || !chair || !chair.naturalHeight) return;\n      if (window.innerWidth < 768) { card.classList.add('chair-ready'); return; }\n      const line = card.querySelector('.jf-title .line:last-child');\n      if (!line) return;\n      // Measured while the hero may be scaled by the scroll transition, so\n      // undo the scale: every distance inside the card shrank by it.\n      const m = /scale\\(([\\d.]+)\\)/.exec(card.closest('.hero')?.style.transform || '');\n      const s = m ? parseFloat(m[1]) || 1 : 1;\n      const cr = card.getBoundingClientRect();\n      const lr = line.getBoundingClientRect();\n      const tr = card.querySelector('.jf-title').getBoundingClientRect();\n      const H = cr.height / s, lineBottom = (lr.bottom - cr.top) / s, lineH = lr.height / s, titleW = tr.width / s;\n      const target = lineBottom - lineH * 0.3;\n      const room = H * 0.96 - target;\n      const natW = chair.naturalWidth, natH = chair.naturalHeight;\n      const visH = (vis.bottom - vis.top) * natH, visW = (vis.right - vis.left) * natW;\n      const scale = Math.min(room / visH, (titleW * 0.45) / visW);\n      card.style.setProperty('--chair-w', `${natW * scale}px`);\n      card.style.setProperty('--chair-top', `${target - vis.top * natH * scale}px`);\n      card.style.setProperty('--chair-left', `calc(50% - ${((vis.left + vis.right) / 2) * natW * scale}px)`);\n      card.classList.add('chair-ready');\n    };\n    if (chair) {\n      const go = () => placeChair();\n      if (chair.complete) go(); else on(chair, 'load', go);\n      if (document.fonts?.ready) document.fonts.ready.then(go);   // the headline's size depends on the font\n      on(window, 'resize', placeChair);\n      setTimeout(() => card.classList.add('chair-ready'), 1500);  // never leave it hidden\n    }\n\n    // Images below the fold come in as you reach them, tied to the scroll\n    // rather than played once: each opens from a slightly inset, rounded\n    // frame and settles from a small zoom, the way the Legacy home page's\n    // pictures arrive. Transform and clip only; skipped for reduced motion.\n    if (!reduced && window.gsap && window.ScrollTrigger) {\n      const gsap = window.gsap;\n      const imgs = [...root.querySelectorAll('.sec img, .final-band img')].filter((im) => !im.closest('.ghl-box'));\n      const tweens = imgs.map((im) => {\n        const box = im.parentElement;\n        if (box && getComputedStyle(box).overflow === 'visible') box.style.overflow = 'hidden';\n        const bg = im.classList.contains('final-bg');\n        return gsap.fromTo(im,\n          bg ? { scale: 1.12 } : { clipPath: 'inset(8% 6% 8% 6% round 28px)', scale: 1.14 },\n          {\n            ...(bg ? { scale: 1 } : { clipPath: 'inset(0% 0% 0% 0% round 0px)', scale: 1 }),\n            ease: 'none',\n            scrollTrigger: { trigger: box || im, start: 'top 95%', end: bg ? 'bottom top' : 'top 35%', scrub: 0.6 },\n          });\n      });\n      offs.push(() => tweens.forEach((t) => { t.scrollTrigger?.kill(); t.kill(); }));\n    }\n\n    // Hero to form. p is how far through the wrapper's extra half-screen the\n    // page has scrolled; eased = p(2 - p) slows it into the end. Transform and\n    // opacity only, written once per frame.\n    const pin = root.querySelector('.hero-pin');\n    const panel = pin?.querySelector('.hero');\n    const copy = panel ? [...panel.querySelectorAll('.jf-copy, .jf-foot')] : [];\n    // The pictures beside the fold: each slides out from behind the card as\n    // it shrinks, the lower ones a beat later, so they arrive as a set.\n    const figs = [...root.querySelectorAll('.fold-gal .fg')].map((el) => ({\n      el, dir: el.closest('.fg-col.l') ? 1 : -1, lag: el.previousElementSibling ? 0.12 : 0,\n    }));\n    if (!pin || !panel) return;\n    let queued = false;\n    const amount = () => (reduced ? 0 : window.innerWidth >= 1180 ? 0.42 : window.innerWidth >= 768 ? 0.10 : 0);\n    const draw = () => {\n      queued = false;\n      const k = amount();\n      if (!k) {\n        panel.style.transform = '';\n        panel.style.borderRadius = '';\n        copy.forEach((c) => { c.style.opacity = ''; });\n        figs.forEach((f) => { f.el.style.opacity = ''; f.el.style.transform = ''; });\n        return;\n      }\n      const r = pin.getBoundingClientRect();\n      const range = r.height - window.innerHeight;\n      const p = range > 0 ? Math.min(1, Math.max(0, -r.top / range)) : 0;\n      const eased = p * (2 - p);\n      panel.style.transform = `scale(${1 - k * eased})`;\n      panel.style.borderRadius = `${14 * eased}px`;\n      copy.forEach((c) => { c.style.opacity = String(1 - 0.25 * eased); });\n      figs.forEach((f) => {\n        const q = Math.min(1, Math.max(0, (eased - 0.2 - f.lag) / 0.6));\n        const e = q * (2 - q);\n        f.el.style.opacity = String(e);\n        f.el.style.transform = `translate3d(${f.dir * (1 - e) * 48}px, ${(1 - e) * 24}px, 0) scale(${0.94 + 0.06 * e})`;\n      });\n    };\n    const queue = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };\n    on(window, 'scroll', queue, { passive: true });\n    on(window, 'resize', queue, { passive: true });\n    draw();\n  }\n}\n<\u002Fscript>\n\n\n<script>\n(function () {\n  if (window.__ssTrack) return;\n  window.__ssTrack = 1;\n  function send(n, p) { if (typeof window.gtag === 'function') window.gtag('event', n, p || {}); }\n  document.addEventListener('click', function (e) {\n    var a = e.target && e.target.closest ? e.target.closest('a, button') : null;\n    if (!a) return;\n    var href = (a.getAttribute('href') || '').trim();\n    var label = (a.textContent || '').trim().slice(0, 60);\n    if (href.indexOf('tel:') === 0) send('phone_click', { link_url: href, link_text: label });\n    else if (href.indexOf('sms:') === 0) send('text_click', { link_url: href, link_text: label });\n    else if (href.indexOf('mailto:') === 0) send('email_click', { link_url: href, link_text: label });\n    else if (/tour|apply|chair|submit/i.test(label)) send('tour_cta_click', { link_text: label });\n  }, true);\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"</script>
