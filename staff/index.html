<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Synergy Salon — Staff</title>
<style>
  /* The same two faces the public site loads, served from the same files, so
     the console looks like Synergy rather than like a tool bolted onto it.
     FK Screamer is deliberately not used: the site references it at a path
     that does not exist, and Anton is what actually renders there. */
  @font-face {
    font-family: 'Geist Variable';
    src: url('/assets/c8304767-0bea-4286-af7c-e4e3a1e5d605.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'Anton';
    src: url('/assets/ed1a36a6-045c-40e2-9f8a-93bcb84a31c4.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  :root {
    /* Taken from the live site, not invented. The public stylesheet calls the
       button class "btn-orange" but paints it #5560A6 -- a leftover name from
       the template. The brand is indigo. */
    --indigo-deep: #1e1f5c;
    --indigo:      #353676;
    --periwinkle:  #5560a6;
    --peri-soft:   #b9c0e8;
    --peri-pale:   #e6e8f7;
    --greige:      #f0edee;

    --bg: var(--greige);
    --card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #3d3d3d;
    --muted: #7785ac;
    --line: var(--peri-pale);
    --accent: var(--periwinkle);
    --accent-strong: var(--indigo);
    --accent-ink: #ffffff;
    --warn: #db2b39;
    --radius: 12px;

    --display: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
    --body: 'Geist Variable', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14153a; --card: #1c1d4a; --ink: #f2f3fb; --ink-soft: #d4d8f0;
      --muted: #9aa4cf; --line: #2c2e63;
      --accent: #8b97d6; --accent-strong: #b9c0e8; --accent-ink: #14153a;
      --warn: #ff7480;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14153a; --card: #1c1d4a; --ink: #f2f3fb; --ink-soft: #d4d8f0;
    --muted: #9aa4cf; --line: #2c2e63;
    --accent: #8b97d6; --accent-strong: #b9c0e8; --accent-ink: #14153a;
    --warn: #ff7480;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }

  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: 1.6rem; letter-spacing: 0.01em; text-transform: uppercase;
    margin: 0; line-height: 1.1;
  }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }

  button, input, select { font: inherit; color: inherit; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--card);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  label { display: block; margin: 0 0 14px; }
  label span {
    display: block; margin-bottom: 5px; font-size: 0.8rem;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }

  .btn {
    padding: 12px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
    transition: background 0.15s ease;
  }
  .btn:hover:not(:disabled) { background: var(--accent-strong); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.quiet {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); font-weight: 500;
  }
  .btn.quiet:hover { background: var(--peri-pale); color: var(--indigo); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn.quiet:hover { background: var(--line); color: var(--ink); }
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px;
  }

  /* The logo's wordmark is white -- it is drawn for the site's dark header.
     On a pale card two thirds of it vanish, so it gets the same dark ground
     here rather than a recoloured copy that would drift from the brand. */
  .brandbar {
    background: var(--indigo-deep);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 22px;
    margin: -22px -22px 22px;
  }
  .brandbar .mark { display: block; height: 40px; width: auto; }

  .markchip {
    display: inline-block; background: var(--indigo-deep);
    border-radius: 9px; padding: 8px 12px; margin-bottom: 10px;
  }
  .markchip img { display: block; height: 26px; width: auto; }

  /* sign in */
  .login { max-width: 400px; margin: 10vh auto 0; }
  .login h1 { margin-bottom: 6px; }
  .login p.sub {
    margin: 0 0 24px; color: var(--muted); font-size: 0.82rem;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .error {
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    color: var(--warn); padding: 10px 12px; border-radius: 9px;
    margin-bottom: 16px; font-size: 0.9rem;
  }

  /* diary */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .daynav .btn.quiet { padding: 9px 15px; }
  .daynav input[type=date] { width: auto; }

  .appt {
    display: grid; grid-template-columns: 96px 1fr; gap: 16px;
    padding: 15px 0; border-top: 1px solid var(--line);
  }
  .appt:first-of-type { border-top: 0; }
  .appt .when {
    font-weight: 600; font-variant-numeric: tabular-nums; color: var(--indigo);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .appt .when { color: var(--peri-soft); }
  }
  .appt .who { font-weight: 600; }
  .appt.cancelled .who, .appt.cancelled .when { text-decoration: line-through; opacity: 0.5; }
  .tag {
    display: inline-block; font-size: 0.68rem; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--peri-pale); color: var(--indigo);
    margin-left: 7px; vertical-align: 1px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tag { background: var(--line); color: var(--peri-soft); }
  }
  .tag.warn {
    color: var(--warn); background: transparent;
    border-color: color-mix(in srgb, var(--warn) 45%, transparent);
  }
  .empty { padding: 44px 0; text-align: center; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ─────────────── sign in ─────────────── -->
  <section id="login" class="login hidden">
    <div class="card">
      <div class="brandbar">
        <img class="mark" src="/assets/f44772ad-1f64-4ee1-8ef2-ca08d762f1b4.png" alt="Synergy Salon">
      </div>
      <h1>Staff Sign In</h1>
      <p class="sub">Synergy Salon</p>
      <div id="loginError" class="error hidden"></div>
      <form id="loginForm">
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" style="width:100%">Sign in</button>
      </form>
    </div>
  </section>

  <!-- ─────────────── diary ─────────────── -->
  <section id="console" class="hidden">
    <div class="topbar">
      <div>
        <span class="markchip">
          <img src="/assets/f44772ad-1f64-4ee1-8ef2-ca08d762f1b4.png" alt="Synergy Salon">
        </span>
        <h1 id="salonName">Synergy Salon</h1>
        <div class="small muted" id="whoami"></div>
      </div>
      <button class="btn quiet" id="signOut">Sign out</button>
    </div>

    <div class="daynav">
      <button class="btn quiet" id="prevDay" aria-label="Previous day">←</button>
      <input type="date" id="dayPicker">
      <button class="btn quiet" id="nextDay" aria-label="Next day">→</button>
      <button class="btn quiet" id="today">Today</button>
    </div>

    <div class="card">
      <div class="small muted" id="dayHeading" style="margin-bottom:14px"></div>
      <div id="diary"><div class="empty">Loading…</div></div>
    </div>
  </section>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);

/** Every call goes through here so a lapsed session always lands on the form. */
async function api(path, options = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: options.body ? { 'Content-Type': 'application/json' } : {},
    ...options,
  });
  if (res.status === 401) { showLogin(); throw new Error('signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function showLogin(message) {
  $('console').classList.add('hidden');
  $('login').classList.remove('hidden');
  const box = $('loginError');
  if (message) { box.textContent = message; box.classList.remove('hidden'); }
  else box.classList.add('hidden');
}

function showConsole(me) {
  $('login').classList.add('hidden');
  $('console').classList.remove('hidden');
  $('salonName').textContent = me.salon.name;
  $('whoami').textContent = `${me.user.name} · ${me.user.role.replace('_', ' ')}`;
}

const escape = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderDiary(data) {
  $('dayHeading').textContent = `${data.heading} · ${data.booked} booked`;
  const box = $('diary');

  if (!data.appointments.length) {
    box.innerHTML = '<div class="empty">Nothing booked this day.</div>';
    return;
  }

  box.innerHTML = data.appointments.map((a) => {
    const tags = [
      a.status === 'cancelled' ? '<span class="tag warn">cancelled</span>' : '',
      a.channel === 'staff' ? '<span class="tag">by staff</span>' : '',
      // Surfaced rather than hidden: the team should know when the CRM has
      // not caught up, instead of finding an empty CENTRO later.
      a.status === 'booked' && !a.syncedToCentro
        ? '<span class="tag warn">not in CENTRO yet</span>' : '',
    ].join('');

    const contact = [a.guestPhone, a.guestEmail].filter(Boolean).join(' · ');

    return `
      <div class="appt ${a.status === 'cancelled' ? 'cancelled' : ''}">
        <div>
          <div class="when">${escape(a.time)}</div>
          <div class="small muted">${escape(a.endTime)}</div>
        </div>
        <div>
          <div class="who">${escape(a.guestName)}${tags}</div>
          <div class="small muted">${escape(a.service)} with ${escape(a.stylist)}</div>
          ${contact ? `<div class="small muted">${escape(contact)}</div>` : ''}
          ${a.notes ? `<div class="small" style="margin-top:6px">${escape(a.notes)}</div>` : ''}
          <div class="small muted" style="margin-top:6px">Ref ${escape(a.ref)}</div>
        </div>
      </div>`;
  }).join('');
}

let day = null;

async function loadDay(date) {
  day = date;
  $('dayPicker').value = date;
  $('diary').innerHTML = '<div class="empty">Loading…</div>';
  try {
    renderDiary(await api(`/api/staff/diary?date=${encodeURIComponent(date)}`));
  } catch (err) {
    if (err.message !== 'signed out') {
      $('diary').innerHTML = `<div class="empty">${escape(err.message)}</div>`;
    }
  }
}

function shiftDay(days) {
  const d = new Date(`${day}T12:00:00`);   // midday, so a DST change cannot roll the date
  d.setDate(d.getDate() + days);
  loadDay(d.toISOString().slice(0, 10));
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;
  try {
    const form = new FormData(e.target);
    await api('/api/staff/login', {
      method: 'POST',
      body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
    });
    e.target.reset();
    await start();
  } catch (err) {
    showLogin(err.message === 'signed out' ? 'That email and password do not match.' : err.message);
  } finally {
    button.disabled = false;
  }
});

$('signOut').addEventListener('click', async () => {
  await fetch('/api/staff/logout', { method: 'POST', credentials: 'same-origin' });
  showLogin();
});

$('prevDay').addEventListener('click', () => shiftDay(-1));
$('nextDay').addEventListener('click', () => shiftDay(1));
$('today').addEventListener('click', () => loadDay(todayInSalon()));
$('dayPicker').addEventListener('change', (e) => e.target.value && loadDay(e.target.value));

let salonTz = null;
function todayInSalon() {
  // The front desk may be on a laptop set to another timezone; the diary is
  // always the salon's day.
  return new Date().toLocaleDateString('en-CA', salonTz ? { timeZone: salonTz } : {});
}

async function start() {
  try {
    const me = await api('/api/staff/me');
    salonTz = me.salon.timezone;
    showConsole(me);
    await loadDay(todayInSalon());
  } catch {
    // Any failure to identify the caller means the same thing to a person
    // standing at the front desk: show the form. Reporting "Request failed
    // (404)" above a login box tells them nothing they can act on and looks
    // like the salon's system is broken.
    showLogin();
  }
}

start();
</script>

</body>
</html>
