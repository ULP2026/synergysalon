<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Synergy Salon — Staff</title>
<style>
  :root {
    --bg: #faf8f6;
    --card: #ffffff;
    --ink: #1b1b1b;
    --muted: #6b6b6b;
    --line: #e8e2dc;
    --accent: #e07a3f;
    --accent-ink: #ffffff;
    --ok: #2f7d4f;
    --warn: #b4552a;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15130f; --card: #1f1c18; --ink: #f2ede7; --muted: #a49c92;
      --line: #322d27; --accent: #e08a52; --accent-ink: #1b1b1b;
      --ok: #6cc08c; --warn: #e0a06a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15130f; --card: #1f1c18; --ink: #f2ede7; --muted: #a49c92;
    --line: #322d27; --accent: #e08a52; --accent-ink: #1b1b1b;
    --ok: #6cc08c; --warn: #e0a06a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }

  button, input, select {
    font: inherit; color: inherit;
  }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--card);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  label { display: block; margin: 0 0 14px; }
  label span { display: block; margin-bottom: 5px; font-size: 0.86rem; color: var(--muted); }

  .btn {
    padding: 11px 20px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.quiet {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); font-weight: 500;
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }

  /* login */
  .login { max-width: 380px; margin: 12vh auto 0; }
  .login h1 { margin-bottom: 4px; }
  .login p.sub { margin: 0 0 22px; color: var(--muted); font-size: 0.92rem; }
  .error {
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    color: var(--warn); padding: 10px 12px; border-radius: 9px;
    margin-bottom: 16px; font-size: 0.9rem;
  }

  /* diary */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .daynav .btn.quiet { padding: 8px 14px; }
  .daynav input[type=date] { width: auto; }

  .appt {
    display: grid; grid-template-columns: 92px 1fr; gap: 14px;
    padding: 14px 0; border-top: 1px solid var(--line);
  }
  .appt:first-of-type { border-top: 0; }
  .appt .when { font-weight: 600; font-variant-numeric: tabular-nums; }
  .appt .who { font-weight: 600; }
  .appt.cancelled .who, .appt.cancelled .when { text-decoration: line-through; opacity: 0.55; }
  .tag {
    display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 6px;
    vertical-align: 1px;
  }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ─────────────── sign in ─────────────── -->
  <section id="login" class="login hidden">
    <div class="card">
      <h1>Synergy Salon</h1>
      <p class="sub">Staff sign in</p>
      <div id="loginError" class="error hidden"></div>
      <form id="loginForm">
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" style="width:100%">Sign in</button>
      </form>
    </div>
  </section>

  <!-- ─────────────── diary ─────────────── -->
  <section id="console" class="hidden">
    <div class="topbar">
      <div>
        <h1 id="salonName">Synergy Salon</h1>
        <div class="small muted" id="whoami"></div>
      </div>
      <button class="btn quiet" id="signOut">Sign out</button>
    </div>

    <div class="daynav">
      <button class="btn quiet" id="prevDay" aria-label="Previous day">←</button>
      <input type="date" id="dayPicker">
      <button class="btn quiet" id="nextDay" aria-label="Next day">→</button>
      <button class="btn quiet" id="today">Today</button>
    </div>

    <div class="card">
      <div class="small muted" id="dayHeading" style="margin-bottom:14px"></div>
      <div id="diary"><div class="empty">Loading…</div></div>
    </div>
  </section>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);

/** Every call goes through here so a lapsed session always lands on the form. */
async function api(path, options = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: options.body ? { 'Content-Type': 'application/json' } : {},
    ...options,
  });
  if (res.status === 401) { showLogin(); throw new Error('signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function showLogin(message) {
  $('console').classList.add('hidden');
  $('login').classList.remove('hidden');
  const box = $('loginError');
  if (message) { box.textContent = message; box.classList.remove('hidden'); }
  else box.classList.add('hidden');
}

function showConsole(me) {
  $('login').classList.add('hidden');
  $('console').classList.remove('hidden');
  $('salonName').textContent = me.salon.name;
  $('whoami').textContent = `${me.user.name} · ${me.user.role.replace('_', ' ')}`;
}

const escape = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderDiary(data) {
  $('dayHeading').textContent = `${data.heading} · ${data.booked} booked`;
  const box = $('diary');

  if (!data.appointments.length) {
    box.innerHTML = '<div class="empty">Nothing booked this day.</div>';
    return;
  }

  box.innerHTML = data.appointments.map((a) => {
    const tags = [
      a.status === 'cancelled' ? '<span class="tag warn">cancelled</span>' : '',
      a.channel === 'staff' ? '<span class="tag">by staff</span>' : '',
      // Surfaced rather than hidden: the team should know when the CRM has
      // not caught up, instead of finding an empty CENTRO later.
      a.status === 'booked' && !a.syncedToCentro
        ? '<span class="tag warn">not in CENTRO yet</span>' : '',
    ].join('');

    const contact = [a.guestPhone, a.guestEmail].filter(Boolean).join(' · ');

    return `
      <div class="appt ${a.status === 'cancelled' ? 'cancelled' : ''}">
        <div>
          <div class="when">${escape(a.time)}</div>
          <div class="small muted">${escape(a.endTime)}</div>
        </div>
        <div>
          <div class="who">${escape(a.guestName)}${tags}</div>
          <div class="small muted">${escape(a.service)} with ${escape(a.stylist)}</div>
          ${contact ? `<div class="small muted">${escape(contact)}</div>` : ''}
          ${a.notes ? `<div class="small" style="margin-top:6px">${escape(a.notes)}</div>` : ''}
          <div class="small muted" style="margin-top:6px">Ref ${escape(a.ref)}</div>
        </div>
      </div>`;
  }).join('');
}

let day = null;

async function loadDay(date) {
  day = date;
  $('dayPicker').value = date;
  $('diary').innerHTML = '<div class="empty">Loading…</div>';
  try {
    renderDiary(await api(`/api/staff/diary?date=${encodeURIComponent(date)}`));
  } catch (err) {
    if (err.message !== 'signed out') {
      $('diary').innerHTML = `<div class="empty">${escape(err.message)}</div>`;
    }
  }
}

function shiftDay(days) {
  const d = new Date(`${day}T12:00:00`);   // midday, so a DST change cannot roll the date
  d.setDate(d.getDate() + days);
  loadDay(d.toISOString().slice(0, 10));
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;
  try {
    const form = new FormData(e.target);
    await api('/api/staff/login', {
      method: 'POST',
      body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
    });
    e.target.reset();
    await start();
  } catch (err) {
    showLogin(err.message === 'signed out' ? 'That email and password do not match.' : err.message);
  } finally {
    button.disabled = false;
  }
});

$('signOut').addEventListener('click', async () => {
  await fetch('/api/staff/logout', { method: 'POST', credentials: 'same-origin' });
  showLogin();
});

$('prevDay').addEventListener('click', () => shiftDay(-1));
$('nextDay').addEventListener('click', () => shiftDay(1));
$('today').addEventListener('click', () => loadDay(todayInSalon()));
$('dayPicker').addEventListener('change', (e) => e.target.value && loadDay(e.target.value));

let salonTz = null;
function todayInSalon() {
  // The front desk may be on a laptop set to another timezone; the diary is
  // always the salon's day.
  return new Date().toLocaleDateString('en-CA', salonTz ? { timeZone: salonTz } : {});
}

async function start() {
  try {
    const me = await api('/api/staff/me');
    salonTz = me.salon.timezone;
    showConsole(me);
    await loadDay(todayInSalon());
  } catch {
    // Any failure to identify the caller means the same thing to a person
    // standing at the front desk: show the form. Reporting "Request failed
    // (404)" above a login box tells them nothing they can act on and looks
    // like the salon's system is broken.
    showLogin();
  }
}

start();
</script>

</body>
</html>
